<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9B3"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9C784E"/>
    </linearGradient>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Luxury Monogram Icon -->
  <g transform="translate(10, 8)">
    <!-- Architectural Diamond / Frame -->
    <rect x="2" y="2" width="60" height="60" rx="8" fill="#181818" stroke="url(#goldGrad)" stroke-width="1.5" />
    <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>
    
    <!-- Stylized R and G -->
    <text x="32" y="42" font-family="'Cinzel', 'Playfair Display', serif" font-size="25" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RG</text>
    
    <!-- Delicate accent dot -->
    <circle cx="32" cy="52" r="1.5" fill="#EED9B3" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 20)">
    <!-- Brand Name -->
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="4">RG DECORATORS</text>
    
    <!-- Tagline & Specialization -->
    <text x="1" y="40" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#C5A880" letter-spacing="2.8">INTERIOR DESIGN &amp; DECORATION STUDIO</text>
  </g>
</svg>
